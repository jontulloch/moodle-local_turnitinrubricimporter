name: Moodle 5.2 checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moodle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        database: [mariadb, pgsql]
    services:
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:10.11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pgsql, curl, gd, intl, mbstring, soap, sodium, zip
          ini-values: max_input_vars=5000
          coverage: none
      - name: Set up Moodle plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install Moodle and plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: MOODLE_502_STABLE
      - name: Report available checks and test coverage
        id: coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path("plugin")
          patterns = {
              "phpunit": ("PHPUnit test files", "tests/**/*_test.php"),
              "behat": ("Behat feature files", "tests/behat/**/*.feature"),
              "mustache": ("Mustache templates", "**/*.mustache"),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as outputs, open(
              os.environ["GITHUB_STEP_SUMMARY"], "a"
          ) as summary:
              summary.write("### Available checks and test coverage\n\n")
              summary.write("| Check | Files found | Execution |\n| --- | ---: | --- |\n")
              for key, (label, pattern) in patterns.items():
                  count = sum(path.is_file() for path in root.glob(pattern))
                  outputs.write(f"{key}={str(count > 0).lower()}\n")
                  status = "Enabled" if count else "Skipped: no matching files"
                  summary.write(f"| {label} | {count} | {status} |\n")
                  print(f"{label}: {count}. {status}.")
              summary.write(
                  "\nA skipped suite is not evidence of test coverage. "
                  "PHPMD findings are advisory, following the upstream template.\n"
              )
          PY

      - name: PHP syntax
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci phpmd

      - name: Moodle PHP coding standards (PHPCS)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc validation
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Moodle plugin validation
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache lint
        if: ${{ !cancelled() && steps.coverage.outputs.mustache == 'true' }}
        run: moodle-plugin-ci mustache

      - name: Grunt lint and build
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit
        if: ${{ !cancelled() && steps.coverage.outputs.phpunit == 'true' }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Core privacy checks for this plugin
        if: ${{ !cancelled() }}
        working-directory: moodle
        run: >-
          php vendor/bin/phpunit public/privacy/tests/privacy/provider_test.php
          --filter '(test_null_provider|test_all_providers_compliant).*local_turnitinrubricimporter'

      - name: Behat features (Chrome)
        id: behat
        if: ${{ !cancelled() && steps.coverage.outputs.behat == 'true' }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat failure artifacts
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: behat-faildump-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled checks as failed
        if: ${{ cancelled() }}
        run: exit 1
